services:
  db:
    image: postgres:15
    container_name: gallery-db
    # Loopback only: Docker's published ports bypass the host firewall, and
    # this password is public in the repository.
    ports:
      - "127.0.0.1:5432:5432"
    # Schema comes from the migration runner (npm run migrate in backend/),
    # not initdb, so every database records what it has applied.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=gallery
      - POSTGRES_PASSWORD=gallery_dev_password
      - POSTGRES_DB=gallery
    restart: unless-stopped

volumes:
  postgres_data:
