<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jacob Fain Photography</title>
    <!-- Crawlers and link unfurlers do not run the app, so these static tags
         are the whole preview for every page but a public gallery's, whose
         title, description, image and URL the backend fills in
         (backend/src/services/sharePreview.ts finds the tags by these exact
         attributes). og:image must be absolute. -->
    <meta name="description" content="Photography portfolio of Jacob Fain." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jacob Fain Photography" />
    <meta property="og:title" content="Jacob Fain Photography" />
    <meta property="og:description" content="Photography portfolio of Jacob Fain." />
    <meta property="og:image" content="https://jacobfain.gallery/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="City towers under an overcast sky, captioned Jacob Fain Photography" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jacob Fain Photography" />
    <meta name="twitter:description" content="Photography portfolio of Jacob Fain." />
    <meta name="twitter:image" content="https://jacobfain.gallery/og-image.jpg" />
    <!-- The build rewrites this to the same fingerprinted file the
         @font-face in globals.css loads. A font preload needs crossorigin
         even from the same origin, or the browser fetches the file twice. -->
    <link rel="preload" href="/src/assets/fonts/inter/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Applies the theme before first paint. A file, not inline, so the
         Content-Security-Policy can allow only same-origin scripts. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
