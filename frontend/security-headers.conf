# Shared security headers. nginx drops server-level add_header lines in any
# location that sets its own, so every such location includes this file.

# Photos and downloads come from presigned S3 URLs; the lightbox's download
# button fetches them, hence S3 in connect-src too. Inline style attributes
# are used by React components and libraries, so style-src allows them;
# scripts are the built bundles plus Cloudflare Web Analytics, which
# Cloudflare injects into every page at the edge: its beacon loads from
# static.cloudflareinsights.com and reports to cloudflareinsights.com.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amazonaws.com; connect-src 'self' https://*.amazonaws.com https://cloudflareinsights.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
