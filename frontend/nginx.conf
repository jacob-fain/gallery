server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Visitors arrive through Cloudflare and its tunnel, so the connecting
    # address is the Docker network gateway. Cloudflare sets CF-Connecting-IP
    # to the visitor and overwrites any client value, so it is trusted only on
    # connections from the host side of Docker.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    # Only the photo upload route takes a large body (see /api/photos/upload).
    # Everywhere else an oversized request is refused before it is read.
    client_max_body_size 1m;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA fallback and the index directive both end here, so every page
    # load revalidates index.html. A cached copy would name chunks that a
    # deploy has replaced.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # robots.txt is read per host, and the admin host serves the same files,
    # so the admin host refuses all crawling here. The public host leaves
    # /api/ open: crawlers render the SPA, which needs the API for any page
    # content, and private data is access-controlled by the API itself.
    location = /robots.txt {
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        if ($host ~* ^manage\.) {
            return 200 "User-agent: *\nDisallow: /\n";
        }
        return 200 "User-agent: *\nDisallow:\n\nSitemap: https://$host/sitemap.xml\n";
    }

    # Built by the backend from the public galleries (routes/sitemap.ts).
    location = /sitemap.xml {
        proxy_pass http://backend:3001/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Proxy API to backend container. ^~ keeps the static-asset regex below
    # from ever catching an API path that ends in .jpg, .js and so on.
    location ^~ /api/ {
        # No URI part: the request path goes to the backend unchanged, and the
        # regex location below is not allowed one.
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replaces any client-sent value: the backend trusts this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # multer caps a photo at 50 MB (backend/src/config/upload.ts); the
        # extra 5 MB is multipart framing and the other form fields. The body
        # streams to the backend as it arrives instead of being spooled to
        # disk first. The backend answers only after sharp has made both
        # resized copies and all three are in S3, which can outlast 60 s over
        # a home uplink. Cloudflare gives up on the origin after 100 s, so
        # that is the effective limit in production.
        location = /api/photos/upload {
            proxy_pass http://backend:3001;
            client_max_body_size 55m;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Gallery ZIPs stream one photo at a time and can be gigabytes.
        # Unbuffered, nginx passes the stream through instead of spooling it
        # to a temp file when the visitor reads slower than S3 delivers.
        # proxy_read_timeout bounds the gap between two reads from the
        # backend, not the whole download, so the 60 s default holds.
        location ~ ^/api/galleries/[^/]+/download$ {
            proxy_pass http://backend:3001;
            proxy_buffering off;
            include /etc/nginx/snippets/security-headers.conf;
        }
    }

    # Vite's built files have a content hash in their names, so they can be
    # cached for good. Unhashed files (theme.js, the icon) keep the default
    # caching so a change reaches visitors.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
