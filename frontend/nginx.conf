server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Visitors arrive through Cloudflare and its tunnel, so the connecting
    # address is the Docker network gateway. Cloudflare sets CF-Connecting-IP
    # to the visitor and overwrites any client value, so it is trusted only on
    # connections from the host side of Docker.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    # Allow large file uploads (photos)
    client_max_body_size 200M;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA fallback and the index directive both end here, so every page
    # load revalidates index.html. A cached copy would name chunks that a
    # deploy has replaced.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Proxy API to backend container. ^~ keeps the static-asset regex below
    # from ever catching an API path that ends in .jpg, .js and so on.
    location ^~ /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replaces any client-sent value: the backend trusts this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Vite's built files have a content hash in their names, so they can be
    # cached for good. Unhashed files (theme.js, the icon) keep the default
    # caching so a change reaches visitors.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
