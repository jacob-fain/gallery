# Every container's log is capped at 3 files of 10 MB. The backend writes one
# line per request, and the Docker default (json-file, no limit) can fill the
# server's root disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:80:80"   # localhost only: the Cloudflare tunnel and deploy health check use localhost:80; Caddy serves the LAN on 192.168.0.125:80
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks:
      - gallery

  backend:
    build: ./backend
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gallery:${DB_PASSWORD}@db:5432/gallery
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      db:
        condition: service_healthy
    # tini as PID 1 forwards SIGTERM, so a restart drains requests instead of
    # waiting out the kill timeout. The grace period outlasts the backend's
    # own 25 s shutdown cap.
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *logging
    networks:
      - gallery

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=gallery
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=gallery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging
    networks:
      - gallery

volumes:
  postgres_data:

networks:
  gallery:
    driver: bridge
