version: 2
updates:
  # Keeps the digest-pinned base images in the Dockerfiles current. Majors are
  # ignored: a Node or nginx major is a deliberate upgrade, not a routine bump.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # npm minor and patch releases arrive as one grouped PR per package, so
  # in-range fixes land before they pile up. Majors open their own PRs: each
  # needs its breaking changes read and the affected code tested.
  - package-ecosystem: npm
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # @types/node tracks the Node runtime (24), so its major moves only with a
    # Node upgrade.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
