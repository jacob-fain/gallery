name: Feature request
description: Something new the site or admin should do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What should it do
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we know it is finished
