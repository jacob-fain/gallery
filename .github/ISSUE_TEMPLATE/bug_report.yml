name: Bug report
description: Something on the site or in the admin behaves wrong
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL or path where it happened (for example /g/wedding-2026 or manage./photos)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: For example iPhone 15, Safari
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open ... 2. Click ... 3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
