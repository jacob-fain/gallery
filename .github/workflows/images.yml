name: Images

# Builds the backend and frontend images on GitHub's runners, never on the
# server. Pull requests build without pushing, so a broken Dockerfile fails
# here instead of at deploy time. Pushes to main and v* tags push to GHCR,
# where the server pulls them by digest, then record a GitHub Deployment
# that the server's poller applies (deploy/README.md): main to staging, a v*
# tag to production. Tags are created only by a release on Jacob's word.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.app }}
    # A v* tag builds nothing: production gets the exact images built when
    # that commit reached main, which staging already ran.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/gallery-${{ matrix.app }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      # Opaque id the backend reports on /api/health/ready, so a deploy can
      # see the new release answer. A hash of ref and commit: it reveals no
      # version on the public route.
      - name: Build id
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "BUILD_ID=$(printf '%s:%s' "$REF_NAME" "$GITHUB_SHA" | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build${{ env.PUSH == 'true' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_ID=${{ env.BUILD_ID }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Save digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s' "$DIGEST" > "digests/${{ matrix.app }}"

      - uses: actions/upload-artifact@v7
        if: env.PUSH == 'true'
        with:
          name: digest-${{ matrix.app }}
          path: digests/${{ matrix.app }}
          retention-days: 1

      - name: Summary
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### gallery-${{ matrix.app }}"
            echo ""
            echo "- Digest: \`$DIGEST\`"
            echo "- Build id: \`$BUILD_ID\`"
            echo "- Pull: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Records the deployment the server applies. Off until the server-side
  # poller is installed: set the repository variable PULL_DEPLOY_ENABLED to
  # true to turn it on, so nothing queues up before then.
  deploy:
    needs: build
    if: >-
      !cancelled() && github.event_name == 'push' && vars.PULL_DEPLOY_ENABLED == 'true' &&
      (needs.build.result == 'success' || (github.ref_type == 'tag' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      packages: write
    concurrency:
      group: deploy-${{ github.ref_type == 'tag' && 'production' || 'staging' }}
      cancel-in-progress: false
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/download-artifact@v8
        if: github.ref_type != 'tag'
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: github.ref_type == 'tag'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Production promotes the images main built for this exact commit and
      # adds the version tag to them; a tag on a commit that never reached
      # main has no images and fails here.
      - name: Promote the images built on main
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p digests
          for app in frontend backend; do
            source="$REGISTRY/gallery-$app:sha-$GITHUB_SHA"
            digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -r .digest) \
              || { echo "::error::No $app image for $GITHUB_SHA. Release only commits that are on main."; exit 1; }
            docker buildx imagetools create -t "$REGISTRY/gallery-$app:$VERSION" "$REGISTRY/gallery-$app@$digest"
            printf '%s' "$digest" > "digests/$app"
          done

      - name: Create the deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          ENVIRONMENT: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
        run: |
          frontend=$(cat digests/frontend)
          backend=$(cat digests/backend)
          for d in "$frontend" "$backend"; do
            [[ $d =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest: $d"; exit 1; }
          done
          # transient_environment stays false so a newer success marks older
          # deployments inactive. required_contexts is empty: the images
          # this deployment names already exist.
          jq -n --arg ref "$REF" --arg env "$ENVIRONMENT" \
                --arg fe "$frontend" --arg be "$backend" '{
              ref: $ref, environment: $env, auto_merge: false,
              required_contexts: [], production_environment: ($env == "production"),
              description: "Images built for \($ref)",
              payload: { frontend_digest: $fe, backend_digest: $be }
            }' > body.json
          id=$(gh api -X POST "repos/$REPO/deployments" --input body.json --jq .id)
          {
            echo "### Deployment to $ENVIRONMENT"
            echo ""
            echo "- Deployment id: $id (the server applies it within about a minute)"
            echo "- Frontend: \`$frontend\`"
            echo "- Backend: \`$backend\`"
          } >> "$GITHUB_STEP_SUMMARY"
