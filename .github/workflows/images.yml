name: Images

# Builds the backend and frontend images on the self-hosted ci-build runners,
# never on the production server. Pull requests build the images their
# change touches without pushing, so a broken Dockerfile fails here instead
# of at deploy time. Pushes to main build both and push them to the LAN
# registry, where the server pulls them by digest, then record a GitHub
# Deployment that the server's poller applies (deploy/README.md): main to
# staging, a v* tag to production. Tags are created only by a release on
# Jacob's word.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Pull requests cancel a superseded run. Every main commit and tag gets a
# group of its own: a release promotes the sha-<commit> images of one exact
# main commit, so no main build may be cancelled or dropped from a queue.
concurrency:
  group: images-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: registry.lan
  # Where the runner image installs the registry's local CA (docs/ci.md).
  # BuildKit runs in its own container and does not read the system trust
  # store, so the builder is given the file explicitly.
  REGISTRY_CA: /usr/local/share/ca-certificates/registry-lan.crt

jobs:
  changes:
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ci","ci-light"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # JSON list of the images to build: both on main and manual runs, the
      # touched ones on a pull request, none on a tag.
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/path-filters.yml
      - id: apps
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHARED: ${{ steps.filter.outputs.shared }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            apps='[]'
          elif [ "$EVENT" != pull_request ] || [ "$SHARED" = true ]; then
            apps='["backend","frontend"]'
          else
            list=()
            [ "$BACKEND" = true ] && list+=('"backend"')
            [ "$FRONTEND" = true ] && list+=('"frontend"')
            apps="[$(IFS=,; echo "${list[*]}")]"
          fi
          echo "Images to build: $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.app }}
    needs: changes
    # A v* tag builds nothing: production gets the exact images built when
    # that commit reached main, which staging already ran.
    if: needs.changes.outputs.apps != '[]'
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ci","ci-build"]') }}
    # Generous for a cold layer cache on a shared build box.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    env:
      IMAGE: registry.lan/gallery-${{ matrix.app }}
      # Only main pushes images (and so only main commits ever have a
      # sha-<commit> image a release could promote). Pull requests, Dependabot
      # and manual runs on other branches build without pushing and never see
      # the registry credentials. GitHub-hosted runners cannot reach the LAN
      # registry, so they never push either.
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RUNNER_MODE != 'hosted' }}
      HAS_REGISTRY_LOGIN: ${{ secrets.REGISTRY_USER != '' && secrets.REGISTRY_PASSWORD != '' }}
    steps:
      # A main commit without images can never be released, so missing
      # credentials fail the run instead of skipping the push.
      - name: Registry credentials are set
        if: env.PUSH == 'true' && env.HAS_REGISTRY_LOGIN != 'true'
        run: |
          echo "::error::REGISTRY_USER and REGISTRY_PASSWORD must be set to push main's images."
          exit 1

      - uses: actions/checkout@v4

      # Opaque id the backend reports on /api/health/ready, so a deploy can
      # see the new release answer. A hash of ref and commit: it reveals no
      # version on the public route.
      - name: Build id
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "BUILD_ID=$(printf '%s:%s' "$REF_NAME" "$GITHUB_SHA" | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      # The dind sidecar is reached through DOCKER_HOST; buildx can create a
      # builder on it only through a named context.
      - name: Docker context for the builder
        if: vars.RUNNER_MODE != 'hosted'
        run: docker context create builders

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: vars.RUNNER_MODE != 'hosted'
        with:
          endpoint: builders
          # Host networking inside dind, so BuildKit resolves and reaches
          # registry.lan the way the runner does.
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."${{ env.REGISTRY }}"]
              ca = ["${{ env.REGISTRY_CA }}"]

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: vars.RUNNER_MODE == 'hosted'

      - name: Log in to the registry
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build${{ env.PUSH == 'true' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A v* tag promotes these images without rebuilding, so no version
          # is known here; the admin metrics route shows the commit.
          build-args: |
            BUILD_ID=${{ env.BUILD_ID }}
            GIT_SHA=${{ github.sha }}
          # The cache lives in the registry beside each image. Only a pushing
          # run writes it. Reads are anonymous (the registry allows pulls from
          # the runners' addresses), so pull requests use it without logging
          # in; a cache miss is a warning, not a failure. A failed cache write
          # never fails a build.
          cache-from: >-
            ${{ vars.RUNNER_MODE == 'hosted' && format('type=gha,scope={0}', matrix.app)
            || format('type=registry,ref={0}:buildcache', env.IMAGE) }}
          cache-to: >-
            ${{ vars.RUNNER_MODE == 'hosted' && format('type=gha,mode=max,scope={0}', matrix.app)
            || (env.PUSH == 'true' && format('type=registry,ref={0}:buildcache,mode=max,ignore-error=true', env.IMAGE) || '') }}

      - name: Save digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s' "$DIGEST" > "digests/${{ matrix.app }}"

      - uses: actions/upload-artifact@v7
        if: env.PUSH == 'true'
        with:
          name: digest-${{ matrix.app }}
          path: digests/${{ matrix.app }}
          retention-days: 1

      - name: Summary
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### gallery-${{ matrix.app }}"
            echo ""
            echo "- Digest: \`$DIGEST\`"
            echo "- Build id: \`$BUILD_ID\`"
            echo "- Pull: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Records the deployment the server applies. Off until the server-side
  # poller is installed: set the repository variable PULL_DEPLOY_ENABLED to
  # true to turn it on, so nothing queues up before then. It needs the LAN
  # registry, so it never runs in hosted mode.
  deploy:
    needs: build
    if: >-
      !cancelled() && github.event_name == 'push' && vars.PULL_DEPLOY_ENABLED == 'true' &&
      vars.RUNNER_MODE != 'hosted' &&
      (needs.build.result == 'success' || (github.ref_type == 'tag' && needs.build.result == 'skipped'))
    runs-on: ${{ fromJSON('["self-hosted","linux","ci","ci-light"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-${{ github.ref_type == 'tag' && 'production' || 'staging' }}
      cancel-in-progress: false
    steps:
      # Main runs are not serialized (see concurrency above), so an older
      # commit's build can finish after a newer one's. Staging only ever
      # moves to the newest main commit; the newer run deploys itself.
      - name: This commit is still the head of main
        id: head
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "main is at $head now; its own run deploys staging." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/download-artifact@v8
        if: github.ref_type != 'tag' && steps.head.outputs.newest == 'true'
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      # A release may only name a commit that is on main.
      - uses: actions/checkout@v4
        if: github.ref_type == 'tag'
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main. Release only commits that are on main."; exit 1; }

      - name: Docker context for the builder
        if: github.ref_type == 'tag'
        run: docker context create builders

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: github.ref_type == 'tag'
        with:
          endpoint: builders
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."${{ env.REGISTRY }}"]
              ca = ["${{ env.REGISTRY_CA }}"]

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.ref_type == 'tag'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Production promotes the images main built for this exact commit and
      # adds the version tag to them; a tag on a commit that never reached
      # main has no images and fails here.
      - name: Promote the images built on main
        if: github.ref_type == 'tag'
        # shell: bash adds pipefail, so a failed inspect cannot leave an
        # empty digest behind a succeeding jq.
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p digests
          for app in frontend backend; do
            source="$REGISTRY/gallery-$app:sha-$GITHUB_SHA"
            digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -r .digest) \
              || { echo "::error::No $app image for $GITHUB_SHA. Release only commits that are on main."; exit 1; }
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::Unexpected digest for $source: '$digest'"; exit 1; }
            docker buildx imagetools create -t "$REGISTRY/gallery-$app:$VERSION" "$REGISTRY/gallery-$app@$digest"
            printf '%s' "$digest" > "digests/$app"
          done

      - name: Create the deployment
        if: github.ref_type == 'tag' || steps.head.outputs.newest == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          ENVIRONMENT: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
        run: |
          frontend=$(cat digests/frontend)
          backend=$(cat digests/backend)
          for d in "$frontend" "$backend"; do
            [[ $d =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest: $d"; exit 1; }
          done
          # transient_environment stays false so a newer success marks older
          # deployments inactive. required_contexts is empty: the images
          # this deployment names already exist.
          jq -n --arg ref "$REF" --arg env "$ENVIRONMENT" \
                --arg fe "$frontend" --arg be "$backend" '{
              ref: $ref, environment: $env, auto_merge: false,
              required_contexts: [], production_environment: ($env == "production"),
              description: "Images built for \($ref)",
              payload: { frontend_digest: $fe, backend_digest: $be }
            }' > body.json
          id=$(gh api -X POST "repos/$REPO/deployments" --input body.json --jq .id)
          {
            echo "### Deployment to $ENVIRONMENT"
            echo ""
            echo "- Deployment id: $id (the server applies it within about a minute)"
            echo "- Frontend: \`$REGISTRY/gallery-frontend@$frontend\`"
            echo "- Backend: \`$REGISTRY/gallery-backend@$backend\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # An off-box copy of each release on GHCR, for recovery if the LAN registry
  # is lost. Nothing deploys from it. Off unless the repository variable
  # GHCR_MIRROR is true; private GHCR storage counts against the account's
  # package quota.
  mirror-ghcr:
    if: github.ref_type == 'tag' && vars.GHCR_MIRROR == 'true' && vars.RUNNER_MODE != 'hosted'
    runs-on: ${{ fromJSON('["self-hosted","linux","ci","ci-light"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Docker context for the builder
        run: docker context create builders
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          endpoint: builders
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."${{ env.REGISTRY }}"]
              ca = ["${{ env.REGISTRY_CA }}"]
      # Reading registry.lan needs no login; only GHCR is written.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the release images to GHCR
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          GHCR: ghcr.io/${{ github.repository_owner }}
        run: |
          for app in frontend backend; do
            source="$REGISTRY/gallery-$app:sha-$GITHUB_SHA"
            digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -r .digest) \
              || { echo "::error::No $app image for $GITHUB_SHA."; exit 1; }
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::Unexpected digest for $source: '$digest'"; exit 1; }
            docker buildx imagetools create -t "$GHCR/gallery-$app:$VERSION" "$REGISTRY/gallery-$app@$digest"
            echo "- \`$GHCR/gallery-$app:$VERSION\` = \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done

  # The one check to require for this workflow; see ci-ok in ci.yml. The
  # deploy and mirror jobs run only after a merge or a release, so on a pull
  # request this reports the image builds.
  images-ok:
    if: always()
    needs: [changes, build, deploy, mirror-ghcr]
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ci","ci-light"]') }}
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::An image job failed or was cancelled; see the jobs above."
          exit 1
      - run: echo "All image jobs passed or were skipped."
