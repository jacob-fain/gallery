name: Images

# Builds the backend and frontend images on GitHub's runners, never on the
# server. Pull requests build without pushing, so a broken Dockerfile fails
# here instead of at deploy time. Pushes to main and v* tags push to GHCR,
# where the server pulls them by digest.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/gallery-${{ matrix.app }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      # Opaque id the backend reports on /api/health/ready, so a deploy can
      # see the new release answer. A hash of ref and commit: it reveals no
      # version on the public route.
      - name: Build id
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "BUILD_ID=$(printf '%s:%s' "$REF_NAME" "$GITHUB_SHA" | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build${{ env.PUSH == 'true' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_ID=${{ env.BUILD_ID }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Summary
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### gallery-${{ matrix.app }}"
            echo ""
            echo "- Digest: \`$DIGEST\`"
            echo "- Build id: \`$BUILD_ID\`"
            echo "- Pull: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
