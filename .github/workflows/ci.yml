name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request supersedes the run in flight. Every other run
# gets a group of its own (ref and commit), so a push to main is never
# cancelled, not even while queued behind another: a shared group would drop
# a pending main run when a third one arrived.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Jobs run on the self-hosted runners (docs/ci.md). The repository variable
# RUNNER_MODE=hosted sends every job back to GitHub-hosted runners instead.

jobs:
  changes:
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ci","ci-light"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.frontend == 'true' }}
      deploy: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.deploy == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/path-filters.yml

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ci","ci-light"]') }}
    # Install, typecheck, test and build take about two minutes; a hung step
    # fails well before the six-hour default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # Database-backed tests run against this throwaway Postgres; the test
    # setup rebuilds its schema with the migration runner, which also proves
    # every migration applies to an empty database. On a self-hosted runner
    # the container runs in the runner's dind sidecar, which shares the
    # runner's network namespace, so localhost reaches the published port.
    services:
      postgres:
        image: postgres:15.20-alpine@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gallery_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U test -d gallery_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/gallery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfiles and .nvmrc.
          node-version: 24.22.3
          # Self-hosted runners keep the npm cache on a persistent volume, so
          # the Actions cache would only add a download and an upload.
          cache: ${{ vars.RUNNER_MODE == 'hosted' && 'npm' || '' }}
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # The build config excludes tests; this checks them, and test/, under the
      # ESM settings vitest runs them with.
      - run: npm run typecheck:tests
      # Coverage is reported, not enforced: no threshold fails the job yet.
      - run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node ../.github/scripts/coverage-summary.mjs Backend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ci","ci-light"]') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: ${{ vars.RUNNER_MODE == 'hosted' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Warnings fail the job too, so lint stays clean instead of drifting.
      - run: npx eslint . --max-warnings 0
      - run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node ../.github/scripts/coverage-summary.mjs Frontend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  # Runs on every change: a secret can land in any file.
  secret-scan:
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ci","ci-light"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned: a security gate must not change behavior between runs through
      # a mutable tag. Bump deliberately.
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source . --no-banner --redact --config .gitleaks.toml

  deploy-scripts:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ci","ci-light"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck deploy/host/homelab-gallery-apply
      - name: Poller tests
        run: python3 -m unittest deploy/test_poll.py
      - name: Wrapper refuses bad arguments before touching anything
        run: |
          set +e
          for args in "" "dev a b" "prod sha256:short sha256:short" "staging sha256:$(printf 'a%.0s' {1..64}) latest"; do
            out=$(bash deploy/host/homelab-gallery-apply $args 2>&1); code=$?
            echo "[$code] $out"
            [ "$code" = 2 ] || { echo "expected exit 2 for: $args"; exit 1; }
          done
      - name: Compose files are valid
        run: |
          printf 'FRONTEND_IMAGE=f\nBACKEND_IMAGE=b\n' > /tmp/pins.env
          for f in deploy/compose/prod.yml deploy/compose/staging.yml; do
            docker compose -f "$f" --env-file /tmp/pins.env config -q 2>/dev/null
          done

  # The one check to require for this workflow. A job the path filter skipped
  # counts as passed; a failed or cancelled job fails this one. It runs even
  # when a job it needs failed, so the check always reports.
  ci-ok:
    if: always()
    needs: [changes, backend, frontend, secret-scan, deploy-scripts]
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ci","ci-light"]') }}
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A CI job failed or was cancelled; see the jobs above."
          exit 1
      - run: echo "All CI jobs passed or were skipped by the path filter."
