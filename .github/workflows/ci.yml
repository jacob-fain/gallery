name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request supersedes the run in flight. Pushes to main
# always run to completion, so the deployable branch is never left unverified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Install, typecheck, test and build take about two minutes; a hung step
    # fails well before the six-hour default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # Database-backed tests run against this throwaway Postgres; the test
    # setup rebuilds its schema with the migration runner, which also proves
    # every migration applies to an empty database.
    services:
      postgres:
        image: postgres:15.20-alpine@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gallery_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U test -d gallery_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/gallery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfiles and .nvmrc.
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # Coverage is reported, not enforced: no threshold fails the job yet.
      - run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node ../.github/scripts/coverage-summary.mjs Backend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Warnings fail the job too, so lint stays clean instead of drifting.
      - run: npx eslint . --max-warnings 0
      - run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node ../.github/scripts/coverage-summary.mjs Frontend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned: a security gate must not change behavior between runs through
      # a mutable tag. Bump deliberately.
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source . --no-banner --redact --config .gitleaks.toml

  deploy-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck deploy/host/homelab-gallery-apply
      - name: Poller tests
        run: python3 -m unittest deploy/test_poll.py
      - name: Wrapper refuses bad arguments before touching anything
        run: |
          set +e
          for args in "" "dev a b" "prod sha256:short sha256:short" "staging sha256:$(printf 'a%.0s' {1..64}) latest"; do
            out=$(bash deploy/host/homelab-gallery-apply $args 2>&1); code=$?
            echo "[$code] $out"
            [ "$code" = 2 ] || { echo "expected exit 2 for: $args"; exit 1; }
          done
      - name: Compose files are valid
        run: |
          printf 'FRONTEND_IMAGE=f\nBACKEND_IMAGE=b\n' > /tmp/pins.env
          for f in deploy/compose/prod.yml deploy/compose/staging.yml; do
            docker compose -f "$f" --env-file /tmp/pins.env config -q 2>/dev/null
          done

