name: E2E

# Browser smoke tests against the production images (e2e/). Too slow to gate
# every pull request: they run on main and on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Building the two images is most of the run; the tests take seconds.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    env:
      # Kept up after the tests so a failure can dump its logs; the last step
      # removes it.
      E2E_KEEP_STACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Stack logs
        if: failure()
        run: docker compose -p gallery-e2e -f compose.yml logs --no-color --timestamps
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
      - name: Remove the stack
        if: always()
        run: docker compose -p gallery-e2e -f compose.yml down --volumes --remove-orphans
