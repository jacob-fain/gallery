# TLS in front of the stack, as Cloudflare is in production: the session
# cookie is Secure, so the admin UI only works over https.

server {
    listen 443 ssl;
    server_name gallery.localhost manage.gallery.localhost;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;

    # The frontend's own nginx enforces the real body limits.
    client_max_body_size 60m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}

# The S3 stand-in. Its name is under amazonaws.com so the production CSP,
# which allows images from https://*.amazonaws.com, applies unchanged. The
# backend reaches this server by a network alias, the browser by a host
# resolver rule (playwright.config.ts).
server {
    listen 443 ssl;
    server_name s3.e2e.amazonaws.com;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;

    client_max_body_size 60m;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        # Host and the raw request URI pass through untouched: both are part
        # of the request signature.
        proxy_pass http://s3:8333;
        proxy_set_header Host $http_host;
    }
}
